<!DOCTYPE html>
<html>
<head>
  <title>OCR Upload (Fast)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>
<body>
  <h2>Upload a License Plate Image</h2>
  <input type="file" id="fileInput" />
  <p id="output">Result will appear here...</p>

  <script>
    document.getElementById('fileInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('output').innerText = "Processing...";

      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = async () => {
        // Resize for speed
        const canvas = document.createElement('canvas');
        canvas.width = 500;
        canvas.height = img.height * (500 / img.width);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // Preprocess with OpenCV
        let src = cv.imread(canvas);
        let gray = new cv.Mat();
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
        cv.threshold(gray, gray, 120, 255, cv.THRESH_BINARY);
        cv.imshow(canvas, gray);
        src.delete(); gray.delete();

        // Run OCR
        const result = await Tesseract.recognize(canvas, 'eng', {
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
        });

        document.getElementById('output').innerText = 
          "Recognized Text: " + result.data.text.trim();
      };
    });
  </script>
</body>
</html>
